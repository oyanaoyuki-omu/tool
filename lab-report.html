<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実験記録レポート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --border: #d6d0c4;
    --accent: #2a5c8a;
    --accent2: #1a3d5c;
    --text: #1e1e1e;
    --muted: #7a7060;
    --label-bg: #eae6df;
    --danger: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }

  /* ===== EDITOR UI (non-print) ===== */
  .editor-bar {
    background: var(--accent2);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .editor-bar .title {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: .08em;
    color: #a8c8e8;
  }
  .bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    padding: 8px 16px;
    border: none; border-radius: 6px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button:hover { opacity: .85; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .btn-primary {
    background: #4a9fd4; color: #fff;
  }
  .btn-secondary {
    background: rgba(255,255,255,.15); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
  }
  .btn-print {
    background: #27ae60; color: #fff;
  }
  .btn-danger {
    background: rgba(192,57,43,.7); color: #fff;
    font-size: 11px; padding: 6px 10px;
  }

  /* ===== REPORT AREA ===== */
  .report-wrap {
    max-width: 860px;
    margin: 32px auto;
    padding: 0 20px 32px;
  }

  /* Header section */
  .report-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 24px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .report-header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    color: var(--accent2);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 6px 16px;
    align-items: start;
  }
  .meta-field label {
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }
  .meta-field input, .meta-field textarea {
    width: 100%;
    background: var(--label-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 10px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
    resize: none;
  }
  .meta-field input:focus, .meta-field textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }
  .meta-field.full { grid-column: 1 / -1; }
  .meta-field textarea { height: 72px; }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    background: var(--surface);
    margin-bottom: 14px;
    transition: border-color .2s, background .2s;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: #eef4fa;
  }
  .upload-zone .icon { font-size: 24px; margin-bottom: 4px; }
  .upload-zone p { font-size: 12px; }
  .upload-zone small { font-size: 11px; color: #aaa; }
  #fileInput { display: none; }

  /* Items grid */
  .items-section { display: flex; flex-direction: column; gap: 10px; }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    display: flex;
    flex-direction: row;
    align-items: flex-start;
  }

  .item-media {
    position: relative;
    background: #1a1a2e;
    flex-shrink: 0;
    width: 180px;
    align-self: flex-start;
  }
  .item-media img {
    width: 180px;
    height: auto;
    display: block;
    object-fit: unset;
  }
  .item-media video {
    width: 180px;
    height: auto;
    display: block;
  }
  .media-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: .05em;
  }
  .item-num {
    position: absolute; bottom: 8px; right: 8px;
    background: var(--accent);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .item-content {
    flex: 1;
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item-content label {
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .item-content input[type="text"],
  .item-content textarea {
    width: 100%;
    background: var(--label-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--text);
    outline: none;
    resize: none;
    transition: border-color .15s;
  }
  .item-content input:focus,
  .item-content textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }
  .item-content textarea { height: 36px; }
  .item-filename {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-actions {
    display: flex; gap: 6px; margin-top: auto;
  }
  .btn-move {
    background: var(--label-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 10px; font-size: 12px;
  }
  .btn-mic {
    background: var(--label-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 8px; font-size: 13px;
    border-radius: 5px;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
  }
  .btn-mic.recording {
    background: #e74c3c;
    color: #fff;
    border-color: #c0392b;
    animation: pulse .7s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { opacity: 1; }
    to   { opacity: .5; }
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }

  /* ===== PRINT STYLES ===== */
  @media print {
    /* A4: 297mm、上下マージン10mm×2=20mm → 有効277mm
       ヘッダー約14mm + margin 2mm = 16mm
       gap 2mm × 4 = 8mm
       カード5枚分: (277 - 16 - 8) / 5 = 50.6mm → 50mm */
    @page { margin: 10mm 10mm; size: A4; }

    body { background: #fff; }

    .editor-bar, .upload-zone, .item-actions, .btn-danger,
    .btn-move { display: none !important; }

    .report-wrap { max-width: 100%; margin: 0; padding: 0; }

    /* ヘッダーを極力コンパクトに */
    .report-header {
      border: 1px solid #ccc;
      box-shadow: none;
      break-inside: avoid;
      margin-bottom: 2mm;
      padding: 2mm 3mm;
    }
    .meta-grid { gap: 1mm 8mm; }
    .meta-field label { font-size: 7px; margin-bottom: 0; }
    .meta-field input, .meta-field textarea {
      background: transparent !important;
      border: none !important;
      border-bottom: 0.3mm solid #ccc !important;
      padding: 0 !important;
      font-size: 9px;
      height: auto;
    }
    .meta-field textarea { height: 8mm; min-height: unset; resize: none; }

    /* カード */
    .items-section { gap: 2mm; }

    .item-card {
      break-inside: avoid;
      page-break-inside: avoid;
      box-shadow: none;
      border: 1px solid #ccc;
      border-radius: 2px;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
    }

    .item-media {
      flex-shrink: 0;
      width: 60mm;
      align-self: flex-start;
    }
    .item-media img,
    .item-media video {
      width: 60mm !important;
      height: auto !important;
      display: block;
      object-fit: unset !important;
    }
    .media-badge { font-size: 7px; padding: 1px 3px; }
    .item-num { width: 18px; height: 18px; font-size: 9px; }

    /* テキストエリア */
    .item-content {
      padding: 2mm 3mm;
      gap: 1mm;
      overflow: hidden;
    }
    .item-content label { color: #888; font-size: 7px; }
    .item-content input[type="text"] {
      background: transparent !important;
      border: none !important;
      border-bottom: 0.3mm solid #ddd !important;
      padding: 0 !important;
      font-size: 9px;
    }
    .item-content textarea {
      background: transparent !important;
      border: 0.3mm solid #ddd !important;
      padding: 1mm !important;
      font-size: 9px !important;
      height: 12mm;
      resize: none;
    }
    .item-filename { font-size: 7px; color: #aaa; }
    .item-actions { display: none; }
    .btn-mic { display: none !important; }

    .upload-zone { display: none; }
  }
</style>
</head>
<body>

<!-- Editor toolbar -->
<div class="editor-bar">
  <div class="title">⚗ 実験記録レポート</div>
  <div class="bar-actions">
    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">＋ ファイル追加</button>
    <button class="btn-secondary" onclick="document.getElementById('cameraInput').click()">📷 撮影</button>
    <button class="btn-print" onclick="window.print()">🖨 印刷 / PDF保存</button>
  </div>
</div>

<div class="report-wrap">

  <!-- Report header -->
  <div class="report-header">
    <div class="meta-grid">
      <div class="meta-field">
        <label>実験日</label>
        <input type="date" id="expDate">
      </div>
      <div class="meta-field">
        <label>実験者</label>
        <input type="text" id="expAuthor" placeholder="氏名 / グループ名">
      </div>
      <div class="meta-field full">
        <label>概要・目的</label>
        <div style="display:flex; align-items:flex-start; gap:4px;">
          <textarea id="expSummary" rows="3" placeholder="実験の目的や概要を記入してください" style="flex:1"></textarea>
          <button class="btn-mic" onclick="toggleMic(this)" title="音声入力">🎤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="uploadZone">
    <div class="icon">📷</div>
    <p style="margin-bottom:8px;">写真・動画をここにドロップ</p>
    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
      <button class="btn-primary" style="font-size:12px; padding:6px 14px;" onclick="document.getElementById('fileInput').click()">＋ ファイルを選択</button>
      <button class="btn-primary" style="font-size:12px; padding:6px 14px; background:#27ae60;" onclick="document.getElementById('cameraInput').click()">📷 その場で撮影</button>
    </div>
    <small style="display:block; margin-top:6px;">JPEG / PNG / MP4 / MOV など対応</small>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*,video/*">
  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <!-- Items -->
  <div class="items-section" id="itemsSection">
    <div class="empty-state" id="emptyState">
      <div class="icon">📂</div>
      <p>写真・動画を追加するとここに表示されます</p>
    </div>
  </div>

</div>

<script>
let items = [];

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const itemsSection = document.getElementById('itemsSection');
const emptyState = document.getElementById('emptyState');

// 今日の日付を自動入力
const today = new Date();
document.getElementById('expDate').value = today.toISOString().split('T')[0];

// ファイル選択
fileInput.addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('cameraInput').addEventListener('change', e => { handleFiles(e.target.files); document.getElementById('cameraInput').value = ''; });

// ドラッグ＆ドロップ
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) return;
    const url = URL.createObjectURL(file);
    items.push({ id: Date.now() + Math.random(), url, file, caption: '', comment: '', isVideo: file.type.startsWith('video/') });
  });
  render();
  fileInput.value = '';
}

function render() {
  if (items.length === 0) {
    itemsSection.innerHTML = '';
    itemsSection.appendChild(emptyState);
    return;
  }
  itemsSection.innerHTML = '';

  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.id = item.id;

    const mediaHTML = item.isVideo
      ? `<video src="${item.url}" controls playsinline></video>`
      : `<img src="${item.url}" alt="実験画像 ${idx+1}" loading="lazy">`;

    card.innerHTML = `
      <div class="item-media">
        ${mediaHTML}
        <div class="media-badge">${item.isVideo ? '▶ 動画' : '📷 写真'}</div>
        <div class="item-num">${idx+1}</div>
      </div>
      <div class="item-content">
        <div>
          <label>キャプション（タイトル）</label>
          <div style="display:flex; align-items:center; gap:4px;">
            <input type="text" class="cap-input" value="${esc(item.caption)}" placeholder="例：加熱開始直後の様子" style="flex:1">
            <button class="btn-mic" onclick="toggleMic(this)" title="音声入力">🎤</button>
          </div>
        </div>
        <div>
          <label>コメント・観察記録</label>
          <div style="display:flex; align-items:flex-start; gap:4px;">
            <textarea class="com-input" placeholder="観察した内容・気づき・測定値などを記入" style="flex:1">${esc(item.comment)}</textarea>
            <button class="btn-mic" onclick="toggleMic(this)" title="音声入力">🎤</button>
          </div>
        </div>
        <div class="item-filename">${esc(item.file.name)}</div>
        <div class="item-actions">
          ${idx > 0 ? `<button class="btn-move" onclick="moveItem(${idx}, -1)">↑ 上へ</button>` : ''}
          ${idx < items.length-1 ? `<button class="btn-move" onclick="moveItem(${idx}, 1)">↓ 下へ</button>` : ''}
          <button class="btn-danger" onclick="removeItem(${idx})">✕ 削除</button>
        </div>
      </div>`;

    card.querySelector('.cap-input').addEventListener('input', e => { items[idx].caption = e.target.value; });
    card.querySelector('.com-input').addEventListener('input', e => { items[idx].comment = e.target.value; });

    itemsSection.appendChild(card);
  });
}

function removeItem(idx) {
  URL.revokeObjectURL(items[idx].url);
  items.splice(idx, 1);
  render();
}

function moveItem(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= items.length) return;
  [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
  render();
}

// 音声入力
let activeRecognition = null;

function toggleMic(btn) {
  // textarea か input か両対応
  const field = btn.closest('div').querySelector('textarea, input[type="text"]');

  // 録音中なら停止
  if (btn.classList.contains('recording')) {
    if (activeRecognition) activeRecognition.stop();
    return;
  }

  // Web Speech API 非対応
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('このブラウザは音声入力に対応していません。\nChrome または Edge をお使いください。');
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = true;

  activeRecognition = recognition;
  btn.classList.add('recording');
  btn.textContent = '⏹';

  let baseText = field.value;

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) baseText += final;
    field.value = baseText + interim;
    field.dispatchEvent(new Event('input'));
  };

  recognition.onerror = () => {
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    activeRecognition = null;
  };

  recognition.onend = () => {
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    activeRecognition = null;
  };

  recognition.start();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
