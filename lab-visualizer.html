<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB VISUALIZER — 実験データ可視化</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0e1a;
    --surface:  #0d1220;
    --border:   #1e3a5f;
    --accent:   #00d4aa;
    --accent2:  #0099ff;
    --text:     #e8eaf0;
    --muted:    #5a7a9a;
    --dim:      #a0c4e0;
    --c0: #00d4aa; --c1: #ff6b6b; --c2: #ffd93d;
    --c3: #6bcbff; --c4: #c77dff; --c5: #ff9f43;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #0d1b2a, #1a2744);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .logo-title {
    font-family: 'DM Mono', monospace;
    font-size: 17px; font-weight: 500;
    color: var(--accent);
    letter-spacing: .06em;
  }
  .logo-sub {
    font-size: 11px; color: var(--muted);
    letter-spacing: .1em; margin-top: 1px;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* Sidebar */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  .label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    height: 150px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 10px;
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  .error { color: #ff6b6b; font-size: 11px; margin-top: 4px; }

  button.primary {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 8px;
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-weight: 500; font-size: 13px;
    cursor: pointer;
    letter-spacing: .05em;
    margin-top: 8px;
    transition: opacity .15s, transform .1s;
  }
  button.primary:hover { opacity: .9; transform: translateY(-1px); }
  button.primary:active { transform: translateY(0); }

  /* Chart type toggle */
  .toggle-group { display: flex; gap: 6px; }
  .toggle-btn {
    flex: 1; padding: 8px 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all .15s;
  }
  .toggle-btn.active {
    background: #00d4aa22;
    border-color: var(--accent);
    color: var(--accent);
  }
  .toggle-btn:hover:not(.active) { border-color: #3a6a9a; color: var(--dim); }

  select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--dim);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: var(--accent); }

  /* Y-key checkboxes */
  .ykey-list { display: flex; flex-direction: column; gap: 6px; }
  .ykey-item {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; padding: 5px 8px;
    border-radius: 6px;
    transition: background .1s;
  }
  .ykey-item:hover { background: #ffffff08; }
  .ycheck {
    width: 16px; height: 16px; border-radius: 4px;
    border: 2px solid; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold;
  }
  .ykey-name {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  /* Stats */
  .stat-card {
    background: var(--bg);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 4px;
  }
  .stat-key {
    font-family: 'DM Mono', monospace;
    font-size: 11px; margin-bottom: 4px;
  }
  .stat-vals {
    display: flex; gap: 10px;
    font-size: 11px; color: var(--muted);
  }
  .stat-vals span { color: var(--dim); }

  /* Main chart area */
  main {
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    flex: 1;
  }
  .chart-subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--muted);
    margin-bottom: 18px;
    letter-spacing: .05em;
  }
  .chart-wrap {
    position: relative;
    width: 100%; height: 380px;
  }
  .chart-meta {
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--bg);
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .chart-meta b { color: var(--accent); }

  /* Empty state */
  .empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 13px; gap: 12px;
  }
  .empty .icon { font-size: 52px; }
  .empty .hint { font-size: 11px; color: #1a3050; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚗</div>
  <div>
    <div class="logo-title">LAB VISUALIZER</div>
    <div class="logo-sub">実験データ可視化ツール</div>
  </div>
</header>

<div class="layout">
  <aside>
    <!-- CSV Input -->
    <div>
      <div class="label">CSVデータ</div>
      <textarea id="csvInput" spellcheck="false">time,temperature,pressure,humidity
0,22.1,101.3,45
5,23.4,101.1,46
10,25.0,100.8,48
15,26.3,100.5,50
20,27.1,100.2,52
25,26.8,100.0,51
30,25.5,100.3,49</textarea>
      <div class="error" id="errorMsg" style="display:none"></div>
      <button class="primary" onclick="parseAndDraw()">▶ 描画</button>
    </div>

    <!-- Chart type -->
    <div id="controls" style="display:none">
      <div class="label">グラフの種類</div>
      <div class="toggle-group">
        <button class="toggle-btn active" id="btn-line" onclick="setType('line')">折れ線</button>
        <button class="toggle-btn" id="btn-bar" onclick="setType('bar')">棒グラフ</button>
        <button class="toggle-btn" id="btn-scatter" onclick="setType('scatter')">散布図</button>
      </div>

      <!-- X axis -->
      <div style="margin-top:16px">
        <div class="label">X軸（横軸）</div>
        <select id="xSelect" onchange="redraw()"></select>
      </div>

      <!-- Y axes -->
      <div style="margin-top:16px">
        <div class="label">Y軸（縦軸）— 複数選択可</div>
        <div class="ykey-list" id="ykeyList"></div>
      </div>

      <!-- Stats -->
      <div style="margin-top:16px">
        <div class="label">データ統計</div>
        <div id="statsArea"></div>
      </div>
    </div>
  </aside>

  <main>
    <div class="empty" id="emptyState">
      <div class="icon">⚗</div>
      <div>CSVを貼り付けて「描画」を押してください</div>
      <div class="hint">左のサンプルデータで試すこともできます</div>
    </div>

    <div class="chart-card" id="chartCard" style="display:none; flex:1; display:none">
      <div class="chart-subtitle" id="chartSubtitle"></div>
      <div class="chart-wrap">
        <canvas id="myChart"></canvas>
      </div>
      <div class="chart-meta" id="chartMeta"></div>
    </div>
  </main>
</div>

<script>
const COLORS = ['#00d4aa','#ff6b6b','#ffd93d','#6bcbff','#c77dff','#ff9f43'];
let parsedData = null;
let chartType = 'line';
let chartInstance = null;
let yKeys = [];
let colorMap = {}; // key → color の固定マッピング

function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return null;
  const headers = lines[0].split(',').map(h => h.trim());
  const rows = lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim());
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = isNaN(vals[i]) || vals[i] === '' ? vals[i] : parseFloat(vals[i]);
    });
    return obj;
  });
  return { headers, rows };
}

function parseAndDraw() {
  const text = document.getElementById('csvInput').value;
  const result = parseCSV(text);
  const errEl = document.getElementById('errorMsg');
  if (!result) {
    errEl.style.display = 'block';
    errEl.textContent = 'CSVの形式が正しくありません。1行目にヘッダーが必要です。';
    return;
  }
  errEl.style.display = 'none';
  parsedData = result;

  const numericHeaders = result.headers.filter(h => typeof result.rows[0][h] === 'number');

  // 各数値キーに固定色を割り当て
  colorMap = {};
  numericHeaders.forEach((h, i) => { colorMap[h] = COLORS[i % COLORS.length]; });

  // Set defaults
  document.getElementById('xSelect').innerHTML = result.headers.map(h =>
    `<option value="${h}">${h}</option>`
  ).join('');
  
  yKeys = numericHeaders.slice(1, 3);
  buildYKeyList();
  updateStats();
  redraw();

  document.getElementById('controls').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chartCard').style.display = 'flex';
  document.getElementById('chartCard').style.flexDirection = 'column';
}

function buildYKeyList() {
  if (!parsedData) return;
  const xKey = document.getElementById('xSelect').value;
  const numericHeaders = parsedData.headers.filter(h =>
    typeof parsedData.rows[0][h] === 'number' && h !== xKey
  );
  const container = document.getElementById('ykeyList');
  container.innerHTML = numericHeaders.map((h, i) => {
    const color = colorMap[h] || COLORS[i % COLORS.length];
    const checked = yKeys.includes(h);
    return `
      <div class="ykey-item" onclick="toggleYKey('${h}', this)">
        <div class="ycheck" id="chk-${h}" style="border-color:${color}; background:${checked ? color+'44' : 'transparent'}; color:${color}">
          ${checked ? '✓' : ''}
        </div>
        <span class="ykey-name" style="color:${color}">${h}</span>
      </div>`;
  }).join('');
}

function toggleYKey(key, el) {
  if (yKeys.includes(key)) {
    if (yKeys.length === 1) return; // 最低1つ
    yKeys = yKeys.filter(k => k !== key);
  } else {
    yKeys.push(key);
  }
  buildYKeyList();
  updateStats();
  redraw();
}

function setType(type) {
  chartType = type;
  ['line','bar','scatter'].forEach(t => {
    document.getElementById('btn-'+t).classList.toggle('active', t === type);
  });
  redraw();
}

function redraw() {
  if (!parsedData || yKeys.length === 0) return;
  const xKey = document.getElementById('xSelect').value;
  const rows = parsedData.rows;

  document.getElementById('chartSubtitle').textContent = `${xKey}  →  ${yKeys.join(', ')}`;
  document.getElementById('chartMeta').innerHTML =
    `データ点数: <b>${rows.length}</b>　カラム数: <b>${parsedData.headers.length}</b>　表示系列: <b>${yKeys.length}</b>`;

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const ctx = document.getElementById('myChart').getContext('2d');
  const labels = rows.map(r => r[xKey]);

  let datasets;
  if (chartType === 'scatter') {
    datasets = yKeys.map((key, i) => ({
      label: key,
      data: rows.map(r => ({ x: r[xKey], y: r[key] })),
      backgroundColor: (colorMap[key] || COLORS[i % COLORS.length]) + 'cc',
      borderColor: colorMap[key] || COLORS[i % COLORS.length],
      pointRadius: 6, pointHoverRadius: 8,
    }));
  } else if (chartType === 'line') {
    datasets = yKeys.map((key, i) => ({
      label: key,
      data: rows.map(r => r[key]),
      borderColor: colorMap[key] || COLORS[i % COLORS.length],
      backgroundColor: (colorMap[key] || COLORS[i % COLORS.length]) + '22',
      tension: 0.35,
      pointRadius: 4, pointHoverRadius: 7,
      borderWidth: 2, fill: false,
    }));
  } else {
    datasets = yKeys.map((key, i) => ({
      label: key,
      data: rows.map(r => r[key]),
      backgroundColor: (colorMap[key] || COLORS[i % COLORS.length]) + 'bb',
      borderColor: colorMap[key] || COLORS[i % COLORS.length],
      borderWidth: 1,
      borderRadius: 4,
    }));
  }

  const gridColor = '#1e3a5f';
  const tickColor = '#5a7a9a';
  const tooltipBg = '#0d1220';

  chartInstance = new Chart(ctx, {
    type: chartType === 'scatter' ? 'scatter' : chartType === 'bar' ? 'bar' : 'line',
    data: chartType === 'scatter' ? { datasets } : { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 400, easing: 'easeOutQuart' },
      plugins: {
        legend: {
          labels: {
            color: tickColor,
            font: { family: "'DM Mono', monospace", size: 12 },
            boxWidth: 12, padding: 16,
          }
        },
        tooltip: {
          backgroundColor: tooltipBg,
          borderColor: gridColor, borderWidth: 1,
          titleColor: '#a0c4e0',
          bodyColor: '#e8eaf0',
          titleFont: { family: "'DM Mono', monospace", size: 12 },
          bodyFont: { family: "'DM Mono', monospace", size: 12 },
          padding: 10,
        }
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { color: tickColor, font: { family: "'DM Mono', monospace", size: 11 } },
          border: { color: gridColor },
        },
        y: {
          grid: { color: gridColor },
          ticks: { color: tickColor, font: { family: "'DM Mono', monospace", size: 11 } },
          border: { color: gridColor },
        }
      }
    }
  });
}

function updateStats() {
  if (!parsedData) return;
  const container = document.getElementById('statsArea');
  container.innerHTML = yKeys.map((key, i) => {
    const color = colorMap[key] || COLORS[i % COLORS.length];
    const vals = parsedData.rows.map(r => r[key]).filter(v => typeof v === 'number');
    const avg = (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(3);
    const max = Math.max(...vals).toFixed(3);
    const min = Math.min(...vals).toFixed(3);
    return `
      <div class="stat-card" style="border:1px solid ${color}33">
        <div class="stat-key" style="color:${color}">${key}</div>
        <div class="stat-vals">
          <div>avg: <span>${avg}</span></div>
          <div>max: <span>${max}</span></div>
          <div>min: <span>${min}</span></div>
        </div>
      </div>`;
  }).join('');
}

// Auto-draw on load
window.addEventListener('load', () => parseAndDraw());
</script>
</body>
</html>
